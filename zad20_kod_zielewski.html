    <script type="text/javascript">
     function AB_ziel()
     {
     var xa_ziel= parseFloat(document.getElementById('xa_ziel').value);
     var ya_ziel= parseFloat(document.getElementById('ya_ziel').value);
     var xb_ziel= parseFloat(document.getElementById('xb_ziel').value);
     var yb_ziel= parseFloat(document.getElementById('yb_ziel').value);
     var xc_ziel= parseFloat(document.getElementById('xc_ziel').value);
     var yc_ziel= parseFloat(document.getElementById('yc_ziel').value);
     var ab_ziel= Math.sqrt(Math.pow(xa_ziel-xb_ziel,2)+Math.pow(ya_ziel-yb_ziel,2));
     document.getElementById("nazwa").innerHTML ="Bok AB= "+ab_ziel.toFixed(2)+"cm";
     }
     function BC_ziel()
     {
    var xa_ziel= parseFloat(document.getElementById('xa_ziel').value);
    var ya_ziel= parseFloat(document.getElementById('ya_ziel').value);
    var xb_ziel= parseFloat(document.getElementById('xb_ziel').value);
    var yb_ziel= parseFloat(document.getElementById('yb_ziel').value);
    var xc_ziel= parseFloat(document.getElementById('xc_ziel').value);
    var yc_ziel= parseFloat(document.getElementById('yc_ziel').value);
    var bc_ziel= Math.sqrt(Math.pow(xb_ziel-xc_ziel,2)+Math.pow(yb_ziel-yc_ziel,2));
     document.getElementById("nazwa").innerHTML ="Bok BC= "+bc_ziel.toFixed(2)+"cm";
     }
     function CA_ziel()
     {
    var xa_ziel= parseFloat(document.getElementById('xa_ziel').value);
    var ya_ziel= parseFloat(document.getElementById('ya_ziel').value);
    var xb_ziel= parseFloat(document.getElementById('xb_ziel').value);
    var yb_ziel= parseFloat(document.getElementById('yb_ziel').value);
    var xc_ziel= parseFloat(document.getElementById('xc_ziel').value);
    var yc_ziel= parseFloat(document.getElementById('yc_ziel').value);
    var ca_ziel= Math.sqrt(Math.pow(xc_ziel-xa_ziel,2)+Math.pow(yc_ziel-ya_ziel,2));
     document.getElementById("nazwa").innerHTML ="Bok CA= "+ca_ziel.toFixed(2)+"cm";
     }

{
window.close()
}
</script>
