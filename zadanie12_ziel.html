<html>
<body>
<div style="color:green;font-size:56px;">
<script language="JavaScript">
var D1_ziel=prompt("Data1=","");
var G1_ziel=prompt("Godzina1=","");
var D2_ziel=prompt("Data2=","");
var G2_ziel=prompt("Godzina2=","");
var sekund;
var a=parseFloat(D1_ziel);
var b=parseFloat(D2_ziel);
var c=parseFloat(G1_ziel);
var d=parseFloat(G2_ziel);
sekund=((a-b)*24+c-d)*3600;
document.write("Ilość sekund między dniami "+a+" i "+b+" = "+sekund+"<br>");
function okno_zamknij_zielewski()
{
window.close()
}
</script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_zielewski()"/>
</body>
</html>
