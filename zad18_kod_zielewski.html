<!DOCTYPE html>   
<head>    
<title> Użycie fukcji </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_ziel(a, b) { 
return a + b; 
} 

function odejmowanie_ziel(a, b) {
return a - b;
}

function mnożenie_ziel(a, b) {
return a * b;
}

function od_kwadratu_ziel(a) {
return a * a
}

function odd_kwadratu_ziel(b) {
return b * b
}
function reszta_z_dzielenia_a_przez_b_ziel(a,b){
    return a%b;
}

document.write("suma="+suma_ziel(a,b)+"<br>"); 
document.write("różnica="+odejmowanie_ziel(a, b)+"<br>");
document.write("mnożenie="+mnożenie_ziel(a, b)+"<br>");
document.write("a^2="+od_kwadratu_ziel(a)+"<br>");
document.write("b^2="+odd_kwadratu_ziel(b)+"<br>");
document.write("reszta z dzielenia a przez b="+reszta_z_dzielenia_a_przez_b_ziel(a,b)+"<br>");

</script> 
</div> 
</body>
