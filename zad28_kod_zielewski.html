   <p><h1>1. Rodzaje „filozofii” programowania.</h1>
          -Programowanie strukturalne<br>
          -Programowanie obiektowe</p><br>
   <p><h1>2. Opisz paradygmat programowania strukturalnego. Założenia programowania strukturalnego.</h1>
    Programowanie strukturalne to paradygmat programowania polegający na dzieleniu kodu źródłowego na mniejsze, logicznie spójne bloki (procedury lub funkcje) oraz kontrolowaniu przepływu programu za pomocą ściśle określonych struktur sterujących. Podejście to eliminuje chaotyczne skoki w kodzie (instrukcję GOTO), dzięki czemu programy stają się czytelne, łatwe w testowaniu oraz proste w późniejszym utrzymaniu.</p><br>
   <p><h1>3. Programowanie obiektowe: definicja</h1>
Programowanie obiektowe (ang. object-oriented programming) — sposób programowania, w<br>
którym programy definiuje się za pomocą:<br>
- obiektów (obiekty powoływane są do życia wirtualnego przez programistę, mogą byd kasowane<br> 
przez programistę) np. okienka w Windows->okienko jest obiektem,<br>
- obiekt ma jakiś stan (czyli dane, w programowaniu obiektowym nazywane najczęściej polami) np.<br>
wielośd okienka w Windows,<br>
- obiekt wykazuje pewne zachowanie (czyli posiada pewne procedury w programowaniu<br>
obiektowym nazywane metody). Np. jest zdefiniowana metoda do zmiany wielkości okienka.<br> 
Czyli obiektowy program komputerowy wyrażony jest jako zbiór takich obiektów,<br>
komunikujących się pomiędzy sobą w celu wykonywania zadań.,<br>
        </p><br>
    <p><h1>4. Dlaczego stosujemy programowanie obiektowe?</h1>
      1) Jest to bardziej naturalne podejście przez programistę podczas tworzenia programów ponieważ<br> 
otaczający nas świat to różnego rodzaju przedmioty. Tworząc program komputerowy dokonujemy<br>
pewnego ich odwzorowania rzeczywistości np. definiujemy obiekt samochód. Definiujemy pola<br>
czyli jego stan np. rok produkcji, marka, kolor. Definiujemy również metody czyli co umie np.<br>
hamowanie, przyśpieszanie. Definicja obiektu jego metod i pól znajduje się w klasie. Następnie na<br>
podstawie zdefiniowanego obiektu (może mied pola oraz metody) powołujemy obiekt w pamięci<br>
wirtualnej<br><br>
2) Programowanie obiektowe pozwala na lepsze gospodarowanie pamięciom komputera, ponieważ<br>
gdy obiekt staje się zbędny możemy go usunąd co zwolni pamięd zajmowaną przez ten obiekt. W<br> 
programowaniu strukturalnym aby zwalniad pamięd konieczne było stosowanie dynamicznych<br>
struktur danych np. stos czy kolejka. <br><br>
3) W programowaniu obiektowym dobrze napisana i przetestowana klasa pozwala na stosowaniu<br>
przez innych programistów. Zaoszczędza to czas i środki pieniężne.<br>
    </p><br>
<p><h1>5. Omów następujące pojęcia <br>
* Klasa  <br>
* Obiekt  <br>
* Właściwość  <br>
* Metoda  <br>
* Konstruktor  <br>	
* Dziedziczenie  <br>
* Hermetyzacja  <br>
* Polimorfizm  <br></h1>
<b>Klasa</b> to rodzaj foremki, która opisuje nam jak będą wyglądad tworzone na jej podstawie nowe<br>
obiekty. Klasa jest to złożony typ będący opisem (definicją) obiektu/obiektów wraz z definicją pól i<br>
metod obiektów.<br><br>
<b>Obiekt</b> to instancja (byt, twór) który powstał na podstawie klasy.  Czyli Obiekty są konstrukcjami<br>
programistycznymi mającymi tak zwane właściwości (inaczej pola obiektu), którymi mogą być<br>
zmienne lub inne obiekty. Z obiektami powiązane są funkcje wykonujące operacje na ich<br>
właściwościach, nazywane metodami.<br><br>
<b>Właściwość</b> to  własność obiektu, np. kolor.<br><br>
<b>Metoda</b> to zdolność (czynnośd) którą umie wykonywad obiekt, np. chodzenie (idź). Realizowane w postaci<br>
konstrukcji podobnej do funkcji.<br><br>
<b>Konstruktor</b> to metoda wywoływana w momencie inicjalizacji obiektu. np. tworzymy obiekt a wraz z tworzeniem<br>
obiektu uruchomi się metoda, która nada np. Imię i Nazwisko.<br><br>
<b>Dziedziczenie</b> klasa może dziedziczyć własności od innej klasy. Tworzymy klasę na podstawie innej klasy<br>
pobierając od „rodzica” właściwości i metody, może dopisad nowe pola i nowe metody.<br><br>
<b>Hermetyzacja</b> wewnątrz ciała klasy znajdują się pola i metody. Część pól i metod można odpowiednio ukryć przed<br>
"zewnętrznym światem" klasy tak jak to ma miejsce z przedmiotami ze świata rzeczywistego.<br><br>
<b>Polimorfizm</b> czyli wielopastaciowość. Oznacza to, że dany obiekt może zmieniać swoją postać w<br> 
zależności od potrzeb. Może to być realizowane w formie metody wywoływanej z różną ilością<br>
parametrów. Tak więc utorzony obiekt może być traktowany polimorficznie bo zachowuje się różnie<br> 
w zależności od sposobu uruchamiania jego metody.<br>
</p>
